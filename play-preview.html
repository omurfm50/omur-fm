<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ÖMÜR FM - PLAY Önizleme</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 8px;
      overflow: hidden;
      background: #260000;
      font-family: Tahoma, Arial, sans-serif;
    }
    .player {
      position: relative;
      width: 714px;
      height: 48px;
      overflow: hidden;
      border: 2px solid #050505;
      border-radius: 24px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px #000;
      background: linear-gradient(#8c8f92 0%, #6d7073 55%, #56595b 100%);
    }
    .player::before {
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 21px;
      content: "";
    }
    .cap {
      position: absolute;
      z-index: 5;
      top: 3px;
      bottom: 3px;
      width: 24px;
      background: linear-gradient(#777a7c, #55585a 48%, #343638);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 5px rgba(0,0,0,.55);
    }
    .cap-left { left: 3px; border-radius: 21px 0 0 21px; }
    .cap-right { right: 3px; border-radius: 0 21px 21px 0; }
    .caster-logo {
      position: absolute;
      top: 17px;
      left: 30px;
      width: 69px;
      height: auto;
    }
    .track {
      position: absolute;
      top: 8px;
      left: 121px;
      width: 234px;
      height: 28px;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(#030303, #111);
      color: #f4f4f4;
      font-size: 11px;
      line-height: 28px;
      text-align: center;
      text-shadow: 0 0 4px #6d28d9;
      white-space: nowrap;
    }
    .volume {
      position: absolute;
      top: 13px;
      left: 362px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 20px;
      color: #eee;
      font-size: 16px;
    }
    .line {
      position: relative;
      width: 132px;
      height: 5px;
      overflow: visible;
      background: #e81e4d;
    }
    .line::after {
      position: absolute;
      top: -7px;
      right: 0;
      z-index: 2;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #f2f2f2;
      content: "";
    }
    .speaker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      color: #f2f2f2;
    }
    .speaker svg { display: block; width: 18px; height: 18px; }
    .play {
      position: absolute;
      z-index: 4;
      top: 10px;
      right: 25px;
      display: flex;
      width: 120px;
      height: 21px;
      overflow: hidden;
      border: 0;
      border-radius: 3px;
      padding: 0;
      color: #fff;
      font: bold 14px Tahoma, Arial, sans-serif;
    }
    .play-icon,
    .play-label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 21px;
    }
    .play-icon { width: 38px; background: linear-gradient(90deg, #df4267, #c72e53); font-size: 17px; }
    .play-label { width: 82px; background: #dc4166; }
  </style>
</head>
<body>
  <div class="player" aria-label="PLAY düğmesi görsel önizlemesi">
    <span class="cap cap-left"></span>
    <img class="caster-logo" src="https://cdn.cloud.caster.fm/images/white-logo.svg" alt="Caster.fm">
    <div class="track">♫ ÖMÜR FM ♫</div>
    <div class="volume">
      <span>◀</span><span class="line"></span>
      <span class="speaker" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5c1.6 1.7 1.6 5.3 0 7M19 6c3.2 3.3 3.2 8.7 0 12"></path>
        </svg>
      </span>
    </div>
    <button class="play" type="button" aria-label="Görsel PLAY önizlemesi">
      <span class="play-icon">▶</span><span class="play-label">PLAY</span>
    </button>
    <span class="cap cap-right"></span>
  </div>
</body>
</html>
